name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-api:
    name: API tests (Python)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  test-web:
    name: Web typecheck + build (React/TS)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e-kind:
    name: Deploy to Kubernetes (kind) + smoke test
    needs: [test-api, test-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build -t device-inventory-api:ci --build-arg APP_VERSION=${GITHUB_SHA::7} api
          docker build -t device-inventory-web:ci web

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: ci

      - name: Load images into the cluster
        run: |
          kind load docker-image device-inventory-api:ci --name ci
          kind load docker-image device-inventory-web:ci --name ci

      - name: Deploy manifests
        run: |
          kubectl apply -k k8s/overlays/kind
          kubectl -n device-inventory rollout status deployment/api --timeout=120s
          kubectl -n device-inventory rollout status deployment/web --timeout=120s
          kubectl -n device-inventory get pods,svc -o wide

      - name: Smoke test through the web tier (nginx -> api Service)
        run: |
          kubectl -n device-inventory port-forward svc/web 8080:80 >/tmp/pf.log 2>&1 &
          for i in $(seq 1 20); do curl -fs localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/api/health
          curl -fsS localhost:8080/api/version
          test "$(curl -fsS localhost:8080/api/devices | jq length)" -ge 1
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/api/devices \
            -H 'Content-Type: application/json' \
            -d '{"name":"ci-device-01","mac":"AA:BB:CC:00:00:01","ip":"10.9.9.9","vlan":200}')
          test "$code" = "201"
          curl -fsS localhost:8080/ | grep -q '<div id="root">'
          echo "Smoke test passed"

      - name: Rolling update (zero downtime)
        run: |
          kubectl -n device-inventory set env deployment/api LOG_LEVEL=debug
          kubectl -n device-inventory rollout status deployment/api --timeout=120s
          kubectl -n device-inventory rollout history deployment/api

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n device-inventory get all
          kubectl -n device-inventory describe pods
          kubectl -n device-inventory logs -l app.kubernetes.io/part-of=device-inventory --all-containers --tail=100

  publish:
    name: Publish images to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [e2e-kind]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image prefix (lowercase)
        id: prefix
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.prefix.outputs.value }}/api:${{ github.sha }}
            ${{ steps.prefix.outputs.value }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: |
            ${{ steps.prefix.outputs.value }}/web:${{ github.sha }}
            ${{ steps.prefix.outputs.value }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
