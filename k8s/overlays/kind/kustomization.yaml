# Local/CI overlay: images are side-loaded into kind, so never pull from a registry.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: device-inventory-api
    newTag: ci
  - name: device-inventory-web
    newTag: ci
patches:
  - target: { kind: Deployment }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
